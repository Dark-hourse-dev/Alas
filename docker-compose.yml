# ============================================
# ALAS — Docker Compose
# One-command deployment: docker compose up
# ============================================

services:
  # --- ALAS Backend + Frontend ---
  alas:
    build: .
    container_name: alas-app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIR=/app/backend/data/chroma
      - SQLITE_DB_PATH=/app/backend/data/alas.db
      - HOST=0.0.0.0
      - PORT=8000
      - SAFETY_ENABLED=true
    volumes:
      - alas-data:/app/backend/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Ollama LLM Server ---
  ollama:
    image: ollama/ollama:latest
    container_name: alas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # GPU support (uncomment for NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  alas-data:
    driver: local
  ollama-models:
    driver: local
